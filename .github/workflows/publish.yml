name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.67.2
          cache: true

      # The dev environment has pytest; --locked fails if pixi.lock does not match pixi.toml, so the lock attached
      # to the release is the one the tests ran with.
      - name: Install Pixi dev environment
        run: pixi install -e dev --locked

      # A test failure fails the workflow: no release is created.
      - name: Run tests
        run: pixi run -e dev test

      - name: Create release archive
        run: |
          mkdir -p release_assets

          git archive \
            --format=tar.gz \
            --prefix=phoskintime-${GITHUB_REF_NAME}/ \
            -o release_assets/phoskintime-${GITHUB_REF_NAME}.tar.gz \
            HEAD

      - name: Copy reproducibility files
        run: |
          cp pixi.toml release_assets/
          if [ -f pixi.lock ]; then cp pixi.lock release_assets/; fi
          if [ -f README.md ]; then cp README.md release_assets/; fi
          if [ -f LICENSE ]; then cp LICENSE release_assets/; fi
          if [ -f CITATION.cff ]; then cp CITATION.cff release_assets/; fi

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes from docs/releases/<tag>.md when that file exists; otherwise GitHub's generated notes.
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            release_assets/* \
            --title "$GITHUB_REF_NAME" \
            "${notes_args[@]}"