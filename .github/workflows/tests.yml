name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Skip only this Tests workflow/job when the commit message or PR text contains [skip tests].
    # Do not use [skip ci], because that skips all push/pull_request workflows.
    if: >
      ${{
        !(
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[skip tests]')
        ) &&
        !(
          github.event_name == 'pull_request' &&
          (
            contains(github.event.pull_request.title, '[skip tests]') ||
            contains(github.event.pull_request.body, '[skip tests]')
          )
        )
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: latest
          cache: true

      - name: Install dev environment
        run: pixi install -e dev

      - name: Run tests with coverage
        run: pixi run -e dev coverage-all

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage.xml
            docs/assets/coverage.svg