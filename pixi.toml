[workspace]
name = "phoskintime"
version = "0.4.0"
description = "PhosKinTime: ODE-based modeling of phosphorylation kinetics and transcriptional time-series."
authors = ["Abhinav Mishra <mishraabhinav36@gmail.com>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
license = "BSD-3-Clause"

[dependencies]
python = "3.12.*"
pip = ">=26.1.2,<27"

# Core numerical/scientific stack
numpy = "*"
pandas = "*"
scipy = "*"
scikit-learn = "*"
statsmodels = "*"
numba = "*"

# Plotting, visualization, and file I/O
matplotlib = "*"
seaborn = "*"
plotly = "*"
openpyxl = "*"
xlsxwriter = "*"
adjusttext = "*"

# Optimization, sensitivity analysis, and modeling utilities
pymoo = "*"
cobyqa = "*"
salib = "*"
optuna = "*"
jax = "*"
jaxopt = "*"
diffrax = "*"
numpyro = "*"

# Graph/network tooling
graphviz = "*"
python-graphviz = "*"
pydot = "*"
networkx = "*"

# Bioinformatics / annotation utilities
mygene = "*"

# CLI/config/runtime utilities
tqdm = "*"
python-dotenv = "*"
typer = "*"
jinja2 = "*"
tomli = "*"
git-cliff = ">=2.13.1,<3"
vulture = ">=2.16,<3"
ipykernel = ">=7.2.0,<8"

[pypi-dependencies]
# Not reliably available as a current conda package across all target platforms.
py2cytoscape = "*"

[feature.dev.dependencies]
pytest = "*"
pytest-cov = "*"
nbmake = "*"
ipykernel = "*"
jupyter = "*"
nbformat = "*"
nbclient = "*"
setuptools = "<82"

[feature.dev.pypi-dependencies]
coverage-badge = ">=1.1.2, <2"

[feature.docs.dependencies]
pymdown-extensions = "*"
mkdocstrings = "*"
mkdocstrings-python = "*"
mkdocs-autorefs = "*"

[feature.docs.pypi-dependencies]
zensical = ">=0.0.42, <0.0.43"

[feature.viz.dependencies]
optuna-dashboard = "*"
gravis = "*"

[feature.viz.target.linux-64.dependencies]
pygraphviz = "*"

[feature.viz.target.osx-64.dependencies]
pygraphviz = "*"

[feature.viz.target.osx-arm64.dependencies]
pygraphviz = "*"

[tasks]
changelog = "git cliff -o CHANGELOG.md"
changelog-unreleased = "git cliff --unreleased"
changelog-latest = "git cliff --latest -o CHANGELOG.md"

test = "PYTHONPATH=.:.. pytest"
test-notebooks = "PYTHONPATH=.:.. pytest --nbmake notebooks/*.ipynb"

test-cov = "PYTHONPATH=.:.. pytest --cov=. --cov-report=term-missing --cov-report=xml"

coverage-badge = "mkdir -p docs/assets && coverage-badge -o docs/assets/coverage.svg -f"

coverage-all = "PYTHONPATH=. pytest --cov=. --cov-report=term-missing --cov-report=xml && mkdir -p docs/assets && coverage-badge -o docs/assets/coverage.svg -f"

check-import = "PYTHONPATH=. python -c \"import kinopt, tfopt, protwise, networkmodel, common, config, processing; print('project imports ok')\""

kinopt-local = "PYTHONPATH=. python -m kinopt.local"
kinopt-evol = "PYTHONPATH=. python -m kinopt.evol"
kinopt-fitanalysis = "PYTHONPATH=. python -m kinopt.fitanalysis"

tfopt-local = "PYTHONPATH=. python -m tfopt.local"
tfopt-evol = "PYTHONPATH=. python -m tfopt.evol"

prep = "PYTHONPATH=. python -m processing.cleanup"

model = "PYTHONPATH=. python -m protwise.runner.main"

networkmodel = "PYTHONPATH=. python -m networkmodel.runner"

phoskintime = "PYTHONPATH=.:.. python -m phoskintime.config.cli"
phoskintime-all = "PYTHONPATH=.:.. python -m phoskintime.config.cli all"

network-dashboard = "PYTHONPATH=. python run_dashboard.py"

docs-serve = "zensical serve"
docs-build = "zensical build"

tree-clean = "tree -a -I '.git|.pixi|.venv|venv|env|ENV|__pycache__|.pytest_cache|.mypy_cache|.ruff_cache|.tox|dist|build|*.egg-info|results_*|result_*|logs|.ipynb_checkpoints'"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
viz = { features = ["viz"], solve-group = "default" }
full = { features = ["dev", "docs", "viz"], solve-group = "default" }
