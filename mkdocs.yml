site_name: phoskintime
site_url: https://bibymaths.github.io/phoskintime
site_description: phoskintime - a toolkit for ODE based parameter estimation and optimization for phosphorylation models.
site_author: Abhinav Mishra
repo_url: https://github.com/bibymaths/phoskintime
use_directory_urls: false

theme:
  variant: modern
  language: en
  palette:
    # Automatic/system preference mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: lucide/sun
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: lucide/moon
        name: Switch to system preference

nav:
  - Home: index.md
  - Terms of use: repository/terms_of_use.md
  - Contributing: repository/contributing.md
  - API Reference: reference.md
  - Changelog: repository/changelog.md
  - Documentation:
      - Architecture & Data Flow: Documentation/architecture.md
      - Configuration Reference: Documentation/configuration.md
      - Processing & Mapping: Documentation/processing/README.md
      - Configuration: Documentation/config/README.md
      - Kinase Optimization: Documentation/kinopt/README.md
      - Transcription Factor Optimization: Documentation/tfopt/README.md
      - Protein Wise Models: Documentation/models/README.md
      - Global Network Pruning: Documentation/pruning/README.md
      - Global Network Model: Documentation/global/README.md
      - Steady State Calculation: Documentation/steady/README.md
      - Parameter Estimation: Documentation/paramest/README.md
      - Confidence Intervals: Documentation/identifiability/README.md
      - Sensitivity Analysis: Documentation/sensitivity/README.md
      - Knockout Analysis: Documentation/knockout/README.md
      - Plotting: Documentation/plotting/README.md
      - Utils: Documentation/utils/README.md
      - Dashboard: Documentation/dashboard.md
      - Dashboard Quickstart: dashboard_quickstart.md
      - Dashboard User Guide: dashboard_user_guide.md
      - Dashboard Developer Guide: dashboard_developer_guide.md
      - Dashboard Troubleshooting: dashboard_troubleshooting.md
      - Result Directory Contract: result_directory_contract.md
      - Workflow CLI Reference: workflow_cli_reference.md
      - Scripts: Documentation/scripts.md
      - Metrics & Distance Measures: Documentation/metrics.md

markdown_extensions:
  - pymdownx.arithmatex:
      inline_syntax: ["$", "$"]
      block_syntax: ["$$", "$$"]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.extra
  - attr_list
  - def_list
  - tables

extra_css:
  - styles/overrides.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/contrib/auto-render.min.js
  - js/katex-setup.js

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - .
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            members_order: source
  - autorefs

watch:
  - kinopt
  - tfopt
  - protwise
  - networkmodel
  - common
  - config
  - processing
  - networkpruning
  - notebooks

copyright: >
  Copyright &copy; 2025 <a href="https://bibymaths.github.io">Abhinav Mishra</a>.